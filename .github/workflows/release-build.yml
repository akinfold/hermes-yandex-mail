name: Build release artifacts

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: "Project version that was built"
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Read project version
        id: version
        run: |
          v=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build wheel and sdist
        run: python -m build
      - name: Assemble drop-in plugin archive
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          rm -rf dropin && mkdir -p dropin/yandex_mail
          cp -r hermes_yandex_mail/. dropin/yandex_mail/
          find dropin -name '__pycache__' -type d -prune -exec rm -rf {} +
          ( cd dropin && zip -r "../dist/hermes-yandex-mail-plugin-${v}.zip" yandex_mail )
      - name: Verify wheel imports and exposes register()
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          python -c "import hermes_yandex_mail as p; assert callable(p.register); print('OK', p.__version__)"
      - uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
