# Manual live e2e. Credentials come from a GitHub Environment named
# `yandex-mail-e2e` — define YANDEX_MAIL_LOGIN and YANDEX_MAIL_APP_PASSWORD as
# secrets there. The suite only touches a throwaway message it uploads itself
# and deletes afterwards; it never sends mail to anyone.
name: E2E (live)

on:
  workflow_dispatch:
    inputs:
      install_hermes:
        description: "Install hermes-agent alongside the plugin"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: Live end-to-end tests
    runs-on: ubuntu-latest
    environment: yandex-mail-e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Install hermes-agent (optional)
        if: ${{ inputs.install_hermes }}
        continue-on-error: true
        run: python -m pip install hermes-agent
      - name: Run live E2E tests
        env:
          YANDEX_MAIL_LOGIN: ${{ secrets.YANDEX_MAIL_LOGIN }}
          YANDEX_MAIL_APP_PASSWORD: ${{ secrets.YANDEX_MAIL_APP_PASSWORD }}
        run: python -m pytest -m e2e -v
